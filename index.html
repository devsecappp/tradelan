<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TradeLAN - Funciona!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: white;
            text-align: center;
            padding: 50px;
        }
        button {
            background: #F0C040;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 10px;
            margin-top: 20px;
        }
        input {
            padding: 15px;
            width: 300px;
            font-size: 16px;
            border-radius: 10px;
            border: none;
        }
        #resultado {
            margin-top: 20px;
            text-align: left;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 10px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        h1 {
            color: #F0C040;
        }
    </style>
</head>
<body>
    <h1>🌎 TradeLAN</h1>
    <p>Tu Copiloto de Exportación - IA para emprendedores colombianos</p>
    
    <input type="text" id="producto" placeholder="Ej: café, aguacate, flores...">
    <br>
    <button onclick="analizar()">🔍 Analizar</button>
    
    <div id="resultado"></div>

    <script>
        async function analizar() {
            const producto = document.getElementById('producto').value;
            if (!producto) {
                alert('Escribe un producto');
                return;
            }
            
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = '📊 Analizando mercado para ' + producto + '...';
            
            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product: producto })
                });
                
                if (!response.ok) {
                    throw new Error('Error HTTP: ' + response.status);
                }
                
                const data = await response.json();
                
                if (data.error) {
                    resultadoDiv.innerHTML = '❌ Error: ' + data.error;
                } else {
                    const parsed = JSON.parse(data.result);
                    resultadoDiv.innerHTML = `
                        <h2>📊 Análisis para ${parsed.product}</h2>
                        <p>${parsed.summary}</p>
                        <h3>🏆 Mejores mercados:</h3>
                        <ul>
                            ${parsed.markets.map(m => `<li>${m.flag} <strong>${m.country}</strong>: ${m.avgPriceUSD} (${m.growthRate})</li>`).join('')}
                        </ul>
                        <h3>🚢 Transporte recomendado:</h3>
                        <ul>
                            ${parsed.transport.map(t => `<li>${t.emoji} ${t.name}: ${t.detail}</li>`).join('')}
                        </ul>
                    `;
                }
            } catch(e) {
                resultadoDiv.innerHTML = '❌ Error: ' + e.message;
            }
        }
    </script>
</body>
</html>
